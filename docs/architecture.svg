<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B8199"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C77A5A"/>
    </marker>
    <style>
      .t { fill:#E6EDF3; font-size:13px; }
      .tb { fill:#E6EDF3; font-size:14px; font-weight:600; }
      .tm { fill:#96A7B8; font-size:11.5px; }
      .mono { font-family:'Cascadia Code','Consolas',monospace; }
      .ln { stroke:#6B8199; stroke-width:1.4; fill:none; }
      .lnr { stroke:#C77A5A; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="800" fill="#0B1220"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="#E6EDF3">独立签到模块 · 技术架构</text>
  <text x="40" y="66" class="tm">读取登录态 → 查询当日状态 → 执行领取 → 验证到账 → 缓存结果（闭环）</text>

  <!-- ============ 列 1：本机数据源 ============ -->
  <text x="40" y="104" class="tm" fill="#7FB08A">① 本机数据源</text>

  <rect x="30" y="118" width="250" height="62" rx="8" fill="#16241B" stroke="#3E7A52"/>
  <text x="46" y="142" class="tb">WorkBuddy.exe</text>
  <text x="46" y="162" class="tm mono">F:\WorkBuddy\WorkBuddy.exe</text>

  <rect x="30" y="196" width="250" height="62" rx="8" fill="#16241B" stroke="#3E7A52"/>
  <text x="46" y="220" class="tb">渲染进程页面</text>
  <text x="46" y="240" class="tm">CDP target（app.asar / 登录域名）</text>

  <rect x="30" y="274" width="250" height="80" rx="8" fill="#16241B" stroke="#3E7A52"/>
  <text x="46" y="298" class="tb">官方登录凭据</text>
  <text x="46" y="318" class="tm mono">auth\workbuddy-desktop.info</text>
  <text x="46" y="338" class="tm">accessToken / refreshToken / expiresAt</text>

  <rect x="30" y="370" width="250" height="62" rx="8" fill="#16241B" stroke="#3E7A52"/>
  <text x="46" y="394" class="tb">可选：账号备份目录</text>
  <text x="46" y="414" class="tm mono">&lt;dataDir&gt;\accounts\*.info</text>

  <!-- ============ 列 2：checkin 模块 ============ -->
  <text x="360" y="104" class="tm" fill="#7FA8D8">② checkin 模块（TypeScript）</text>

  <rect x="350" y="118" width="330" height="46" rx="8" fill="#12233A" stroke="#2B5F8F"/>
  <text x="366" y="147" class="t mono">cli.ts  status / run / all / dry-run / daemon</text>

  <rect x="350" y="180" width="330" height="46" rx="8" fill="#12233A" stroke="#2B5F8F"/>
  <text x="366" y="209" class="t mono">scheduler.ts  Asia/Shanghai 10:05 · 退避重试</text>

  <rect x="350" y="242" width="330" height="70" rx="8" fill="#16304F" stroke="#3D7FB8"/>
  <text x="366" y="266" class="tb">checkin-service.ts</text>
  <text x="366" y="286" class="tm">幂等三层：inFlight 锁 → 本地记录 → 服务端去重</text>
  <text x="366" y="303" class="tm">验证到账：积分差额 / 服务端 code</text>

  <rect x="350" y="330" width="105" height="66" rx="8" fill="#12233A" stroke="#2B5F8F"/>
  <text x="362" y="352" class="t">auth-manager</text>
  <text x="362" y="369" class="tm">凭据/信封/</text>
  <text x="362" y="384" class="tm">令牌有效性</text>

  <rect x="462" y="330" width="105" height="66" rx="8" fill="#12233A" stroke="#2B5F8F"/>
  <text x="474" y="352" class="t">credit-api</text>
  <text x="474" y="369" class="tm">积分查询 /</text>
  <text x="474" y="384" class="tm">签到判定</text>

  <rect x="574" y="330" width="106" height="66" rx="8" fill="#12233A" stroke="#2B5F8F"/>
  <text x="586" y="352" class="t">cdp</text>
  <text x="586" y="369" class="tm">发现/连页/</text>
  <text x="586" y="384" class="tm">evaluate</text>

  <rect x="350" y="412" width="330" height="52" rx="8" fill="#12233A" stroke="#2B5F8F"/>
  <text x="366" y="434" class="t mono">state-store · logger</text>
  <text x="366" y="452" class="tm">原子写(0600) · 跨进程锁 · 日志全量脱敏</text>

  <!-- ============ 列 3：官方接口 ============ -->
  <text x="740" y="104" class="tm" fill="#B98BD0">③ 官方接口（仅这些）</text>

  <rect x="730" y="242" width="280" height="70" rx="8" fill="#22182C" stroke="#7A4A8F"/>
  <text x="746" y="264" class="tb">每日签到（领取）</text>
  <text x="746" y="283" class="tm mono">POST /billing/meter/daily-checkin</text>
  <text x="746" y="301" class="tm">body {} → code 0 / 10001</text>

  <rect x="730" y="326" width="280" height="76" rx="8" fill="#22182C" stroke="#7A4A8F"/>
  <text x="746" y="350" class="tb">积分查询（只读）</text>
  <text x="746" y="367" class="tm mono" font-size="10.5">POST /v2/billing/meter/</text>
  <text x="746" y="381" class="tm mono" font-size="10.5">     get-user-resource</text>
  <text x="746" y="393" class="tm" font-size="10">CycleCapacityRemainPrecise 求和</text>

  <rect x="730" y="118" width="280" height="88" rx="8" fill="#191C24" stroke="#4A5568"/>
  <text x="746" y="140" class="tb">域名白名单</text>
  <text x="746" y="159" class="tm mono">www.workbuddy.cn / .ai</text>
  <text x="746" y="177" class="tm mono">www.codebuddy.cn / .ai</text>
  <text x="746" y="195" class="tm">令牌带 iss 时才发请求</text>

  <!-- ============ 底部：持久化 ============ -->
  <rect x="30" y="500" width="980" height="86" rx="8" fill="#1E1B14" stroke="#8F7A3E"/>
  <text x="46" y="524" class="tb">④ 本地持久化（%APPDATA%\workbuddy-auto-checkin，权限 0600）</text>
  <text x="46" y="546" class="tm mono">state.json  { uid: { date: { outcome, ok, code, creditsBefore, creditsAfter, verified } } }</text>
  <text x="46" y="566" class="tm mono">run-log-YYYY-MM-DD.jsonl   执行日期 / 账号(脱敏) / 起止 / 前后积分 / 结果 / 失败原因</text>

  <!-- ============ 底部：安全边界 ============ -->
  <rect x="30" y="604" width="980" height="96" rx="8" fill="#201616" stroke="#8F4A4A"/>
  <text x="46" y="628" class="tb" fill="#E8B4A6">安全边界</text>
  <text x="46" y="650" class="tm">只读官方凭据文件（不写回）· 令牌仅在内存 · 日志全量脱敏 · 不关闭 TLS 校验</text>
  <text x="46" y="670" class="tm">不伪造设备身份 · 不处理验证码/MFA · 未知响应一律保守判定为未成功 · 所有领取操作幂等</text>
  <text x="46" y="690" class="tm">CDP 仅用于身份核对与页面就绪检查；签到不依赖客户端在线</text>

  <!-- ============ 连线 ============ -->
  <!-- 官方凭据文件 → auth-manager -->
  <path class="ln" d="M 280 314 L 320 314 L 320 370 L 350 370" marker-end="url(#arrow)"/>
  <text x="286" y="306" class="tm">读取（只读）</text>

  <!-- 账号备份目录 → auth-manager -->
  <path class="ln" d="M 280 401 L 336 401 L 336 384 L 350 384" marker-end="url(#arrow)"/>

  <!-- WorkBuddy.exe → auth-manager（派生解密密钥） -->
  <path class="ln" d="M 280 149 L 340 149 L 340 336 L 350 336" marker-end="url(#arrow)"/>
  <text x="286" y="141" class="tm">取钥</text>

  <!-- 渲染页 → cdp（经右侧走线，仅一次交叉） -->
  <path class="ln" d="M 280 232 L 712 232 L 712 356 L 680 356" marker-end="url(#arrow)"/>
  <text x="700" y="224" class="tm">CDP :9222</text>

  <!-- cli → scheduler -->
  <path class="ln" d="M 515 164 L 515 180" marker-end="url(#arrow)"/>
  <!-- scheduler → service -->
  <path class="ln" d="M 515 226 L 515 242" marker-end="url(#arrow)"/>
  <!-- service → auth-manager -->
  <path class="ln" d="M 402 312 L 402 330" marker-end="url(#arrow)"/>
  <!-- service → credit-api -->
  <path class="ln" d="M 515 312 L 515 330" marker-end="url(#arrow)"/>
  <!-- service → cdp -->
  <path class="ln" d="M 627 312 L 627 330" marker-end="url(#arrow)"/>

  <!-- credit-api → 签到接口 -->
  <path class="ln" d="M 680 344 L 704 344 L 704 300 L 730 300" marker-end="url(#arrow)"/>
  <!-- credit-api → 积分接口 -->
  <path class="ln" d="M 680 378 L 730 378" marker-end="url(#arrow)"/>

  <!-- service → state-store / logger（走 credit-api 与 cdp 之间的空隙） -->
  <path class="ln" d="M 574 312 L 574 412" marker-end="url(#arrow)"/>

  <!-- state-store / logger → 持久化 -->
  <path class="ln" d="M 515 464 L 515 500" marker-end="url(#arrow)"/>
</svg>
